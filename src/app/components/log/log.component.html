<h2 mat-dialog-title>Log</h2>

<mat-dialog-content>
  <div class="log-container">
    <div class="fs-row.gap-xs">
      @if ((process.state$ | async) === ProcessState.Running) {
        <mat-progress-spinner
          [diameter]="20"
          mode="indeterminate">
        </mat-progress-spinner>
      }
      <div>
        <div class="process-state">
          {{process.state$ | async}}
        </div>
        @if ((process.state$ | async) !== ProcessState.Running) {
          <div class="message small">
            {{process.message$ | async}}
          </div>
        }
      </div>
    </div>
  </div>
  <div class="log">{{process.log$ | async}}</div>
</mat-dialog-content>

<mat-dialog-actions>
  <button
    type="button"
    mat-button
    color="primary"
    mat-dialog-close>
    Done
  </button>
</mat-dialog-actions>
